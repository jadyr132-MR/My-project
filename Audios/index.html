<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro Athletic Audio Roulette</title>
  <!-- Google Font: Inter & Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(23, 31, 50, 0.85);
      --accent-lime: #10b981;
      --accent-cyan: #06b6d4;
      --accent-orange: #f97316;
      --accent-purple: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-glow: rgba(6, 182, 212, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top right, #1e1b4b, #0b0f19 70%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient athletic backdrop images */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(to bottom, rgba(11, 15, 25, 0.88), rgba(11, 15, 25, 0.96)),
        url('https://images.unsplash.com/photo-1517838277536-f5f99be501cd?q=80&w=1600&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      z-index: -1;
    }

    /* Header Bar */
    header {
      text-align: center;
      margin-bottom: 24px;
    }

    .badge-header {
      display: inline-block;
      padding: 4px 14px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.12);
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 20px;
      margin-bottom: 8px;
    }

    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #ffffff 40%, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    /* Main Grid Layout */
    .app-container {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 28px;
      width: 100%;
      max-width: 1080px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .app-container {
        grid-template-columns: 1fr;
        justify-items: center;
      }
    }

    /* Stage / Wheel Section */
    .stage-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      width: 100%;
    }

    .stats-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .stat-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .stat-pill span {
      color: var(--accent-lime);
      font-weight: 800;
    }

    /* Wheel Canvas & Pointer */
    .wheel-wrapper {
      position: relative;
      width: 460px;
      height: 460px;
      max-width: 100%;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.2));
    }

    .pointer-marker {
      position: absolute;
      top: 50%;
      right: -24px;
      transform: translateY(-50%);
      width: 44px;
      height: 34px;
      background: linear-gradient(135deg, #f97316, #ef4444);
      clip-path: polygon(100% 0%, 100% 100%, 0% 50%);
      z-index: 10;
      filter: drop-shadow(0 0 8px rgba(249, 115, 22, 0.6));
    }

    .pointer-marker::after {
      content: '';
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      width: 9px;
      height: 9px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
    }

    /* Control Actions */
    .action-controls {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 420px;
    }

    .btn-spin {
      width: 100%;
      padding: 14px 28px;
      font-family: 'Montserrat', sans-serif;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #0b0f19;
      background: linear-gradient(135deg, var(--accent-lime), #34d399);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
      transition: all 0.2s ease;
    }

    .btn-spin:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
    }

    .btn-spin:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
      box-shadow: none;
    }

    .choice-group {
      display: none;
      gap: 12px;
      width: 100%;
    }

    .btn-choice {
      flex: 1;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-choice-replay {
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(6, 182, 212, 0.4);
    }

    .btn-choice-replay:hover {
      background: var(--accent-cyan);
      color: #0b0f19;
    }

    .btn-choice-remove {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .btn-choice-remove:hover {
      background: #ef4444;
      color: #ffffff;
    }

    .hud-status {
      width: 100%;
      min-height: 48px;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Sidebar Locker */
    .locker-sidebar {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 640px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .locker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 12px;
    }

    .locker-header h2 {
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .count-tag {
      background: var(--accent-orange);
      color: #0b0f19;
      font-size: 11px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 8px;
    }

    .locker-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .locker-list::-webkit-scrollbar {
      width: 5px;
    }
    .locker-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .locker-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      transition: all 0.15s ease;
    }

    .locker-item:hover {
      border-color: var(--accent-cyan);
      background: rgba(6, 182, 212, 0.06);
    }

    .locker-item-code {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 14px;
      color: var(--accent-cyan);
    }

    .btn-play-pill {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--accent-lime);
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-play-pill:hover {
      background: var(--accent-lime);
      color: #0b0f19;
      transform: scale(1.05);
    }

    .empty-state {
      text-align: center;
      padding: 40px 10px;
      color: var(--text-muted);
      font-size: 13px;
      font-style: italic;
    }
  </style>
</head>
<body>

      </div>

      <div class="wheel-wrapper">

        <canvas id="wheelCanvas" width="1000" height="1000"></canvas>
      </div>

      <div class="action-controls">
        <button id="spinBtn" class="btn-spin" onclick="spin()">Spin Roulette</button>

        <div id="choice-group" class="choice-group">
          <button class="btn-choice btn-choice-replay" onclick="repeatCurrentAudio()">🔁 Replay Audio</button>
          <button class="btn-choice btn-choice-remove" onclick="deleteCurrentAndContinue()">🗑️ Remove Drill</button>
        </div>

        <div id="hud-status" class="hud-status">Ready. Press "Spin Roulette" to start.</div>
      </div>
    </main>

    <!-- Right Side Locker / Completed List -->

    const AUDIO_FOLDER = "audios_fitness_en/";

      // SET 5
      { label: "S5-A1", file: "49_Set5_A1_Jenny.mp3" },

      // SET 6
      { label: "S6-01", file: "61_Set6_01_Jenny.mp3" },
      { label: "S6-02", file: "62_Set6_02_Guy.mp3" },
      { label: "S6-03", file: "63_Set6_03_Aria.mp3" },
      { label: "S6-04", file: "64_Set6_04_Christopher.mp3" },
      { label: "S6-05", file: "65_Set6_05_Ava.mp3" },
      { label: "S6-06", file: "66_Set6_06_Andrew.mp3" },
      { label: "S6-07", file: "67_Set6_07_Sonia.mp3" },
      { label: "S6-08", file: "68_Set6_08_Ryan.mp3" },
      { label: "S6-09", file: "69_Set6_09_Natasha.mp3" },
      { label: "S6-10", file: "70_Set6_10_Liam.mp3" },
      { label: "S6-11", file: "71_Set6_11_Michelle.mp3" },
      { label: "S6-12", file: "72_Set6_12_Eric.mp3" }
    ];

    let eliminatedItems = [];

    // Instant Preload Buffer
    const audioCache = {};
    items.forEach(item => {
      const audio = new Audio(AUDIO_FOLDER + item.file);
      audio.preload = "auto";
      audioCache[item.file] = audio;
    });

    // Web Audio API Synthesizer - Intrigue / Suspense sound design
    let audioCtx = null;
    let droneOsc = null;
    let droneLfo = null;
    let droneGain = null;

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Atmospheric suspense drone while spinning
    function startSuspenseDrone() {
      if (!audioCtx) return;
      stopSuspenseDrone();

      const now = audioCtx.currentTime;
      droneOsc = audioCtx.createOscillator();
      droneLfo = audioCtx.createOscillator();
      const lfoGain = audioCtx.createGain();
      droneGain = audioCtx.createGain();

      droneOsc.type = 'sawtooth';
      
      // Low-pass filter for dark, tense cinematic aura
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(160, now);
      filter.frequency.linearRampToValueAtTime(340, now + 3.8); // Builds tension smoothly

      // LFO for suspense vibrato
      droneLfo.frequency.setValueAtTime(4, now);
      lfoGain.gain.setValueAtTime(6, now);
      droneLfo.connect(droneOsc.frequency);

      droneOsc.frequency.setValueAtTime(73.4, now); // Deep D2 suspense root tone

      // Subtle volume envelope
      droneGain.gain.setValueAtTime(0.001, now);
      droneGain.gain.linearRampToValueAtTime(0.09, now + 0.6);

      droneOsc.connect(filter);
      filter.connect(droneGain);
      droneGain.connect(audioCtx.destination);

      droneLfo.start(now);
      droneOsc.start(now);
    }

    function stopSuspenseDrone() {
      if (droneGain && audioCtx) {
        const now = audioCtx.currentTime;
        droneGain.gain.linearRampToValueAtTime(0.0001, now + 0.25);
        setTimeout(() => {
          if (droneOsc) {
            try {
              droneOsc.stop();
              droneLfo.stop();
              droneOsc.disconnect();
              droneLfo.disconnect();
            } catch(e) {}
            droneOsc = null;
            droneLfo = null;
          }
        }, 260);
      }
    }

    // Intriguing resonant suspense tick (Dual detuned pulse)
    function playIntrigueTick() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;

      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      osc1.type = 'sine';
      osc2.type = 'triangle';

      const baseFreq = 480;
      osc1.frequency.setValueAtTime(baseFreq * 1.4, now);
      osc1.frequency.exponentialRampToValueAtTime(baseFreq * 0.4, now + 0.05);

      osc2.frequency.setValueAtTime(baseFreq * 2.08, now); // Slight tense dissonance
      osc2.frequency.exponentialRampToValueAtTime(baseFreq * 0.6, now + 0.05);

      gainNode.gain.setValueAtTime(0.14, now);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);

      osc1.connect(gainNode);
      osc2.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 0.05);
      osc2.stop(now + 0.05);
    }

    // Soft mysterious reveal chime when the roulette lands
    function playRevealChime() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const notes = [587.33, 739.99, 880.00]; // D, F#, A ethereal triad
      
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.05);
        
        gain.gain.setValueAtTime(0, now + i * 0.05);
        gain.gain.linearRampToValueAtTime(0.05, now + i * 0.05 + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.05 + 0.7);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now + i * 0.05);
        osc.stop(now + i * 0.05 + 0.75);
      });
    }

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spinBtn");
    const choiceGroup = document.getElementById("choice-group");
    const hudStatus = document.getElementById("hud-status");
    const counterEl = document.getElementById("counter");
    const lockerList = document.getElementById("lockerList");
    const lockerCount = document.getElementById("locker-count");

    let currentAngle = 0;
    let isSpinning = false;
    let selectedIndex = -1;
    let currentAudio = null;

    function updateCounter() {
      counterEl.textContent = items.length;
    }

    function renderLocker() {
      lockerCount.textContent = eliminatedItems.length;

      if (eliminatedItems.length === 0) {
        lockerList.innerHTML = `<div class="empty-state">No drills completed yet.</div>`;
        return;
      }

      lockerList.innerHTML = "";
      eliminatedItems.forEach(item => {
        const itemDiv = document.createElement("div");
        itemDiv.className = "locker-item";
        itemDiv.innerHTML = `
          <span class="locker-item-code">${item.label}</span>
          <button class="btn-play-pill" onclick="playLockerAudio('${item.file}', '${item.label}')">
            ▶ Play
          </button>
        `;
        lockerList.appendChild(itemDiv);
      });
    }

    function playLockerAudio(file, label) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      currentAudio = audioCache[file] || new Audio(AUDIO_FOLDER + file);
      currentAudio.currentTime = 0;
      currentAudio.play().catch(e => console.warn("Audio Error:", e));
      hudStatus.innerHTML = `🔊 Playing from locker: <b>${label}</b>`;
    }

    function drawWheel() {
      const numItems = items.length;
      const radius = canvas.width / 2;
      const center = radius;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (numItems === 0) {
        ctx.fillStyle = "#1e293b";
        ctx.beginPath();
        ctx.arc(center, center, radius - 20, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = "#10b981";
        ctx.font = "bold 32px 'Montserrat', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("ALL DRILLS COMPLETED!", center, center);
        return;
      }

      const arc = (2 * Math.PI) / numItems;
      const fontSize = Math.max(11, Math.min(22, Math.floor(700 / numItems)));

      for (let i = 0; i < numItems; i++) {
        const angle = currentAngle + i * arc;
        
        ctx.fillStyle = SECTOR_COLORS[i % SECTOR_COLORS.length];
        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius - 18, angle, angle + arc);
        ctx.closePath();
        ctx.fill();

        // White perimeter indicator points
        if (numItems <= 40) {
          const dotAngle = angle;
          const dotX = center + (radius - 28) * Math.cos(dotAngle);
          const dotY = center + (radius - 28) * Math.sin(dotAngle);
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(dotX, dotY, 4, 0, 2 * Math.PI);
          ctx.fill();
        }

        // Radial code text
        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = `800 ${fontSize}px 'Montserrat', sans-serif`;
        ctx.fillText(items[i].label, radius - 45, fontSize / 3.2);
        ctx.restore();
      }

      // Outer bezel ring
      ctx.lineWidth = 14;
      ctx.strokeStyle = "#0f172a";
      ctx.beginPath();
      ctx.arc(center, center, radius - 18, 0, 2 * Math.PI);
      ctx.stroke();

      // Modern Hub Center
      ctx.fillStyle = "#0b0f19";
      ctx.beginPath();
      ctx.arc(center, center, 74, 0, 2 * Math.PI);
      ctx.fill();

      ctx.strokeStyle = "rgba(6, 182, 212, 0.4)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(center, center, 62, 0, 2 * Math.PI);
      ctx.stroke();

      ctx.fillStyle = "#10b981";
      ctx.beginPath();
      ctx.arc(center, center, 28, 0, 2 * Math.PI);
      ctx.fill();
    }

    function spin() {
      if (isSpinning || items.length === 0) return;

      initAudioContext();
      startSuspenseDrone();

      isSpinning = true;
      spinBtn.disabled = true;
      choiceGroup.style.display = "none";
      hudStatus.textContent = "⚡ Roulette is spinning...";

      const spinDuration = 4200;
      const startAngle = currentAngle;
      const extraRounds = (5 + Math.random() * 4) * 2 * Math.PI;
      const targetAngle = startAngle + extraRounds;
      const startTime = performance.now();

      const numItems = items.length;
      const arc = (2 * Math.PI) / numItems;
      let lastTickSector = Math.floor(currentAngle / arc);

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / spinDuration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = startAngle + (targetAngle - startAngle) * easeOut;

        // Trigger intrigue tick sound as sectors pass
        const currentSector = Math.floor(currentAngle / arc);
        if (currentSector !== lastTickSector) {
          playIntrigueTick();
          lastTickSector = currentSector;
        }

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          stopSuspenseDrone();
          playRevealChime();
          finishSpin();
        }
      }

      requestAnimationFrame(animate);
    }

    function finishSpin() {
      const numItems = items.length;
      const arc = (2 * Math.PI) / numItems;
      const normalizedAngle = (currentAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
      const relativeAngle = (2 * Math.PI - normalizedAngle) % (2 * Math.PI);
      
      selectedIndex = Math.floor(relativeAngle / arc) % numItems;
      const selectedItem = items[selectedIndex];

      hudStatus.innerHTML = `🎯 Target Drill: <b style="color:var(--accent-lime); font-size:16px;">${selectedItem.label}</b>`;
      choiceGroup.style.display = "flex";

      // Immediate instant playback
      currentAudio = audioCache[selectedItem.file] || new Audio(AUDIO_FOLDER + selectedItem.file);
      currentAudio.currentTime = 0;
      currentAudio.play().catch(e => console.warn("Audio Error:", e));
    }

    function repeatCurrentAudio() {
      if (currentAudio) {
        currentAudio.currentTime = 0;
        currentAudio.play().catch(e => console.warn("Audio Error:", e));
      }
    }

    function deleteCurrentAndContinue() {
      if (selectedIndex >= 0 && selectedIndex < items.length) {
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        }

        const removedItem = items.splice(selectedIndex, 1)[0];
        eliminatedItems.unshift(removedItem);
        selectedIndex = -1;

        updateCounter();
        renderLocker();

        choiceGroup.style.display = "none";
        
        if (items.length > 0) {
          hudStatus.innerHTML = `✅ <b style="color:var(--accent-cyan);">${removedItem.label}</b> moved to locker. Ready!`;
          spinBtn.disabled = false;
        } else {
          hudStatus.innerHTML = "🏆 Fantastic! All drills completed.";
          spinBtn.disabled = true;
        }

        isSpinning = false;
        drawWheel();
      }
    }

    updateCounter();
    renderLocker();
    drawWheel();
  </script>
</body>
</html>
